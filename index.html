<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWE-JD 数据集 · 高级软件工程师职位描述库</title>
<meta name="description" content="高级软件工程师 JD 聚合数据集：LinkedIn + 中国多平台 + 中国官网直投，统一 schema，支持全文搜索与多维筛选。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="head-text">
    <h1>SWE-JD 数据集</h1>
    <p class="sub">高级软件工程师职位描述（JD）聚合库 · <b data-meta="total">–</b> 条 · 2026-10 快照</p>
    <p class="sub2">LinkedIn（867）+ 中国多平台（427）+ 中国官网直投（1062），统一 schema、跨源去重后 <b data-meta="total">–</b> 条 · 仅供研究学习</p>
  </div>
  <a class="gh" href="https://github.com/Bing2030/SWE-JD-Marketplace" target="_blank" rel="noopener">GitHub 仓库</a>
</header>

<main>
  <section class="searchbar">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="搜索职位 / 公司 / 技能 / JD 全文：agent、智能体、架构、java、RAG…（按 / 聚焦）">
    <select id="sort" title="排序">
      <option value="recent">最新收录</option>
      <option value="title">职位名称</option>
      <option value="company">公司</option>
    </select>
    <span id="count" class="count">加载中…</span>
  </section>

  <section id="stats" class="stats" aria-label="数据统计"></section>

  <div class="layout">
    <aside id="facets" class="facets" aria-label="筛选条件"></aside>
    <section id="list" class="list">
      <div id="cards"></div>
      <button id="more" class="more" hidden>加载更多</button>
      <p id="empty" class="empty" hidden>没有匹配的职位，试试放宽筛选或换个关键词。</p>
    </section>
  </div>
</main>

<footer class="site-foot">
  <p>数据为 <b>2026-10</b> 快照，仅供研究与学习；JD 内容版权归原发布方所有，各条目保留原始链接（展开卡片可见）。联系方式等个人信息未收录；个人筛选标记已剔除。数据 <a href="https://creativecommons.org/licenses/by/4.0/deed.zh" target="_blank" rel="noopener">CC BY 4.0</a> · 站点代码 MIT。</p>
</footer>

<noscript><p class="noscript">本站需要启用 JavaScript 才能搜索与筛选。</p></noscript>
<script src="assets/vendor/minisearch.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
